<!DOCTYPE html>
<html lang="fa" dir="rtl" >
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mostafa Modaberi — My Digital Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3fb;--surface:#fff;--ink:#2b2a3d;--muted:#5f5d7a;--line:#e4e1f2;--accent:#6b5fc7;--accent-ink:#fff;--soft:#e9e6f9;--warn:#8a5a10;--warn-bg:#fdeed2;--shadow:0 1px 2px rgba(60,50,120,.05),0 8px 20px -10px rgba(60,50,120,.18);--font:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.7;transition:background .2s,color .2s}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--bg);font:800 15px/1 "Fraunces",Georgia,serif;letter-spacing:-.04em;direction:ltr}
.who{font-weight:800;line-height:1.2}
.who small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--ink)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13px;min-height:34px}
.btn:hover{border-color:var(--accent)}
.hero{position:relative;overflow:hidden;padding:64px 0 40px}
.mono{position:absolute;inset-inline-end:-10px;top:-30px;font:800 clamp(180px,34vw,360px)/1 "Fraunces",Georgia,serif;letter-spacing:-.08em;color:var(--soft);direction:ltr;user-select:none;pointer-events:none}
.hero .in{position:relative;max-width:620px}
h1{margin:0 0 12px;font-size:clamp(34px,6vw,60px);line-height:1.15;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:17px;max-width:52ch}
.name{margin-top:20px;font-weight:600;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 22px}
.search{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats .btn[aria-pressed=true]{background:#dcd6f7;color:#2f2866;border-color:#b9b0ee}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding-bottom:56px}
.card{--h:200;display:flex;flex-direction:column;gap:10px;background:hsl(var(--h) 80% 96.5%);border:1px solid hsl(var(--h) 55% 87%);border-radius:16px;padding:20px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.card:hover{border-color:hsl(var(--h) 50% 68%)}
.top{display:flex;align-items:center;gap:12px}
.ico{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:hsl(var(--h) 75% 87%);color:hsl(var(--h) 40% 30%);font-size:22px}
.card h2{margin:0;font-size:18px;line-height:1.3}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.st{padding:2px 10px;border-radius:999px;background:hsl(var(--h) 75% 89%);color:hsl(var(--h) 40% 28%);font-weight:600}
.st.dev{background:var(--warn-bg);color:var(--warn)}
.go{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:9px;background:hsl(var(--h) 65% 82%);color:hsl(var(--h) 45% 20%);font-weight:600;font-size:14px}
.go:hover{background:hsl(var(--h) 65% 77%)}
.go[aria-disabled=true]{background:var(--surface);color:var(--muted);border:1px dashed var(--line);cursor:not-allowed}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
.msg{min-height:22px;font-size:13px;color:var(--warn);margin:-10px 0 10px}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
@media(max-width:520px){.who small{display:none}.chip.count{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
html[data-theme="dark"]{--bg:#171625;--surface:#242238;--ink:#f1efff;--muted:#b9b5d0;--line:#393650;--accent:#a69af5;--soft:#292640;--warn:#ffd18a;--warn-bg:#49371f;--shadow:0 8px 24px rgba(0,0,0,.24)}
html[data-theme="dark"] .card{background:#25243a;border-color:#403c60;color:#f1efff}
html[data-theme="dark"] .card p,html[data-theme="dark"] .meta{color:#c4c0d9}
html[data-theme="dark"] .ico{background:#393455;color:#e8e3ff}
html[data-theme="dark"] .st{background:#393455;color:#e8e3ff}
html[data-theme="dark"] .go{background:#51477e;color:#fff}
html[data-theme="dark"] .go:hover{background:#625596}
html[data-theme="dark"] .cats .btn[aria-pressed=true]{background:#403968;color:#fff;border-color:#6e62a9}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="logo" aria-hidden="true">MM</div>
  <div class="who">Mostafa Modaberi<small data-t="subtitle"></small></div>
  <div class="sp"></div>
  <span class="chip count"><span data-t="total"></span> <b id="total">0</b></span>
  <button class="btn" id="lang" type="button"></button>
  <button class="btn" id="theme" type="button" aria-label="Toggle color theme"></button>
</div></header>

<main class="wrap">
  <section class="hero">
    <div class="mono" aria-hidden="true">MM</div>
    <div class="in">
      <h1 data-t="title"></h1>
      <p data-t="intro"></p>
      <div class="name">Mostafa Modaberi · مصطفی مدبری</div>
    </div>
  </section>
  <section aria-label="apps">
    <div class="tools">
      <input class="search" id="q" type="search" autocomplete="off">
      <div class="cats" id="cats" role="group"></div>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer><div class="wrap">
  <span>Designed &amp; Developed by Mostafa Modaberi · <span id="year"></span></span>
  <a id="gh" href="#" target="_blank" rel="noopener" hidden>GitHub</a>
</div></footer>

<script>
// Central config: add a new app by appending one object below.
// hue (0-360) is optional: each app gets its own pastel color automatically, set hue to override.
  // path is relative to the dashboard root and must match apps/APP-NAME/
window.SITE = {
  github: "https://github.com/Mostafa-Modaberi", // e.g. "https://github.com/USERNAME" — footer link stays hidden while empty
  apps: [
    {
      id: "invoice-maker",
      path: "apps/invoice-maker/",
      category: "utility",
      status: "active",
      icon: "🧾",
      name: { fa: "فاکتورساز و مدیریت مالی", en: "Invoice Maker & Finance" },
      desc: {
        fa: "صدور و چاپ فاکتور، مدیریت کالا و انبار، تاریخچه و گزارش‌های مالی.",
        en: "Create and print invoices, manage products and inventory, and review financial reports."
      }
    },
    {
      id: "class-roster",
      path: "apps/class-roster/",
      category: "education",
      status: "active", // "active" | "dev"
      icon: "▦",
      name: { fa: "چاپ لیست کلاسی", en: "Class Roster Print" },
      desc: {
        fa: "ابزاری برای مدیریت، تنظیم و چاپ لیست کلاسی با قالب مناسب چاپ A4.",
        en: "Manage, arrange and print class lists in an A4 print-ready layout."
      }
    }
  ]
};
</script>
<script>
(function(){
  var T={
    fa:{subtitle:"داشبورد وب‌اپلیکیشن‌های شخصی",total:"تعداد برنامه‌ها:",title:"برنامه‌های کاربردی",
      intro:"ساخته شده توسط مصطفی مدبری.",
      search:"جست‌وجوی برنامه‌ها…",all:"همه",open:"ورود به برنامه",soon:"به‌زودی",active:"فعال",dev:"در حال توسعه",
      empty:"برنامه‌ای در این دسته یا با این جست‌وجو پیدا نشد.",devmsg:"این برنامه در حال توسعه است و هنوز باز نمی‌شود.",
      lang:"English",dark:"تم تاریک",light:"تم روشن",
      cat:{education:"آموزشی",utility:"ابزارهای کاربردی",design:"طراحی و گرافیک",code:"برنامه‌نویسی",other:"سایر"}},
    en:{subtitle:"Personal Web Apps Dashboard",total:"Total apps:",title:"Useful Web Apps",
      intro:"Built by Mostafa Modaberi.",
      search:"Search apps…",all:"All",open:"Open app",soon:"Coming soon",active:"Active",dev:"In development",
      empty:"No apps match this category or search.",devmsg:"This app is still in development and cannot be opened yet.",
      lang:"فارسی",dark:"Dark theme",light:"Light theme",
      cat:{education:"Education",utility:"Utilities",design:"Design & Graphics",code:"Programming",other:"Other"}}
  };
  var cfg=window.SITE||{apps:[]},apps=cfg.apps,root=document.documentElement;
  var s={lang:"fa",cat:"all",q:""};
  try{var st=localStorage.getItem("mm-theme");if(st==="dark")document.documentElement.dataset.theme="dark"}catch(e){}
  try{var sl=localStorage.getItem("mm-lang");if(sl==="fa"||sl==="en")s.lang=sl;
}catch(e){}
  var $=function(id){return document.getElementById(id)};
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function render(){
    var t=T[s.lang];
    root.lang=s.lang;root.dir=s.lang==="fa"?"rtl":"ltr";
    document.querySelectorAll("[data-t]").forEach(function(n){n.textContent=t[n.dataset.t]});
    $("q").placeholder=t.search;$("q").setAttribute("aria-label",t.search);
    $("lang").textContent=t.lang;
    $("theme").textContent=root.dataset.theme==="dark"?t.light:t.dark;
    $("total").textContent=apps.length;
    $("msg").textContent="";
    var cats=$("cats");cats.textContent="";
    ["all","education","utility","design","code","other"].forEach(function(c){
      var b=el("button","btn",c==="all"?t.all:t.cat[c]);b.type="button";
      b.setAttribute("aria-pressed",String(s.cat===c));
      b.onclick=function(){s.cat=c;render()};cats.appendChild(b);
    });
    var q=s.q.trim().toLowerCase();
    var list=apps.filter(function(a){
      if(s.cat!=="all"&&a.category!==s.cat)return false;
      if(!q)return true;
      return (a.name.fa+" "+a.name.en+" "+a.desc.fa+" "+a.desc.en).toLowerCase().indexOf(q)>-1;
    });
    var g=$("grid");g.textContent="";
    if(!list.length){g.appendChild(el("div","empty",t.empty));return}
    list.forEach(function(a){
      var c=el("article","card"),top=el("div","top");
      c.style.setProperty("--h",a.hue!=null?a.hue:(apps.indexOf(a)*67+200)%360);
      top.appendChild(el("div","ico",a.icon||"◆")).setAttribute("aria-hidden","true");
      top.appendChild(el("h2",null,a.name[s.lang]));
      c.appendChild(top);
      c.appendChild(el("p",null,a.desc[s.lang]));
      var m=el("div","meta");
      m.appendChild(el("span",null,t.cat[a.category]||t.cat.other));
      m.appendChild(el("span","st"+(a.status==="dev"?" dev":""),a.status==="dev"?t.dev:t.active));
      c.appendChild(m);
      var go=el("a","go",a.status==="dev"?t.soon:t.open);
      if(a.status==="dev"){
        go.href="#";go.setAttribute("aria-disabled","true");
        go.onclick=function(e){e.preventDefault();$("msg").textContent=t.devmsg};
      }else go.href=a.path;
      c.appendChild(go);g.appendChild(c);
    });
  }
  $("lang").onclick=function(){s.lang=s.lang==="fa"?"en":"fa";save("mm-lang",s.lang);render()};
  $("theme").onclick=function(){var dark=root.dataset.theme!=="dark";if(dark)root.dataset.theme="dark";else delete root.dataset.theme;save("mm-theme",dark?"dark":"light");render()};
  $("q").oninput=function(e){s.q=e.target.value;render();$("q").focus()};
  $("year").textContent=new Date().getFullYear();
  if(cfg.github){var gh=$("gh");gh.href=cfg.github;gh.hidden=false}
  render();
})();
</script>
</body>
</html>
