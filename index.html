<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mostafa Modaberi — My Digital Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;--bg-elevated:rgba(255,255,255,.82);--surface:#ffffff;--surface-subtle:#f1f5f9;
  --ink:#0f172a;--ink-secondary:#334155;--muted:#64748b;
  --line:rgba(148,163,184,.22);--line-strong:rgba(148,163,184,.4);
  --accent:#6366f1;--accent-2:#8b5cf6;--accent-3:#ec4899;
  --accent-glow:rgba(99,102,241,.22);--accent-soft:rgba(99,102,241,.1);
  --success:#10b981;--success-bg:rgba(16,185,129,.12);
  --warn:#f59e0b;--warn-bg:rgba(245,158,11,.14);
  --shadow-sm:0 2px 8px -2px rgba(15,23,42,.05);
  --shadow-md:0 12px 32px -8px rgba(15,23,42,.08),0 2px 6px -1px rgba(15,23,42,.04);
  --shadow-lg:0 24px 48px -12px rgba(99,102,241,.16),0 4px 12px -2px rgba(15,23,42,.06);
  --font-fa:"Vazirmatn",system-ui,-apple-system,sans-serif;
  --font-en:"Plus Jakarta Sans","Vazirmatn",system-ui,sans-serif;
  --radius-xl:24px;--ease-spring:cubic-bezier(.22,1,.36,1);
}
html[data-theme="dark"]{
  --bg:#070913;--bg-elevated:rgba(15,19,34,.75);--surface:rgba(18,23,42,.85);--surface-subtle:rgba(30,41,59,.55);
  --ink:#f8fafc;--ink-secondary:#cbd5e1;--muted:#94a3b8;
  --line:rgba(148,163,184,.14);--line-strong:rgba(148,163,184,.28);
  --accent:#818cf8;--accent-2:#a78bfa;--accent-3:#f472b6;
  --accent-glow:rgba(129,140,248,.25);--accent-soft:rgba(129,140,248,.14);
  --success:#34d399;--success-bg:rgba(52,211,153,.14);
  --warn:#fbbf24;--warn-bg:rgba(251,191,36,.14);
  --shadow-sm:0 2px 8px -2px rgba(0,0,0,.4);
  --shadow-md:0 16px 36px -8px rgba(0,0,0,.5);
  --shadow-lg:0 24px 52px -12px rgba(99,102,241,.22),0 8px 20px -4px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--font-fa);
  line-height:1.7;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
  position:relative;transition:background-color .35s ease,color .35s ease;
}
html[lang="en"] body{font-family:var(--font-en)}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Ambient Background & Grid */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient-grid{
  position:absolute;inset:0;opacity:.55;
  background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 50%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 50%,transparent 100%);
}
.blob{position:absolute;border-radius:50%;filter:blur(85px);opacity:.45;animation:floatBlob 18s ease-in-out infinite alternate}
html[data-theme="dark"] .blob{opacity:.28}
.blob-1{width:480px;height:480px;background:radial-gradient(circle,var(--accent),transparent 70%);top:-180px;inset-inline-end:-100px}
.blob-2{width:420px;height:420px;background:radial-gradient(circle,var(--accent-2),transparent 70%);top:120px;inset-inline-start:-140px;animation-delay:-6s}
.blob-3{width:340px;height:340px;background:radial-gradient(circle,var(--accent-3),transparent 70%);bottom:-120px;inset-inline-end:20%;animation-delay:-11s}
@keyframes floatBlob{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(30px,-25px) scale(1.08)}
  100%{transform:translate(-20px,20px) scale(.95)}
}

.wrap{max-width:1180px;width:100%;margin:0 auto;padding:0 24px}

/* Header */
header{
  position:sticky;top:0;z-index:50;background:var(--bg-elevated);
  backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  border-bottom:1px solid var(--line);transition:background .3s ease,border-color .3s ease;
}
.bar{display:flex;align-items:center;gap:14px;height:74px}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  display:grid;place-items:center;width:44px;height:44px;border-radius:13px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  font:800 16px/1 "Fraunces",Georgia,serif;letter-spacing:-.04em;direction:ltr;
  box-shadow:0 6px 18px -4px var(--accent-glow),inset 0 1px 1px rgba(255,255,255,.35);
  transition:transform .3s var(--ease-spring);
}
.brand:hover .logo{transform:rotate(-6deg) scale(1.06)}
.who{font-weight:800;font-size:16px;line-height:1.25;letter-spacing:-.01em}
.who small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.sp{flex:1}
.nav-actions{display:flex;align-items:center;gap:10px}
.chip{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);
  background:var(--surface);border-radius:999px;padding:6px 14px;
  font-size:13px;font-weight:500;color:var(--muted);box-shadow:var(--shadow-sm);
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-bg);animation:pulseDot 2.4s infinite}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.75}}
.chip b{font-weight:800;background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:99px;font-size:12.5px}

.icon-btn{
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:0 13px;height:40px;font-size:13px;font-weight:600;color:var(--ink-secondary);
  box-shadow:var(--shadow-sm);transition:all .25s var(--ease-spring);
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 16px -4px var(--accent-glow)}
.icon-btn:active{transform:translateY(0)}
.icon-btn svg{width:17px;height:17px;flex-shrink:0;transition:transform .4s var(--ease-spring)}
#theme-ico{display:inline-flex;align-items:center}
#theme:hover svg{transform:rotate(25deg) scale(1.1)}

/* Hero Section */
.hero{position:relative;padding:52px 0 34px}
.hero-card{
  position:relative;overflow:hidden;border-radius:var(--radius-xl);border:1px solid var(--line);
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface-subtle) 100%);
  padding:44px;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:space-between;gap:32px;
}
.hero-card::before{content:"";position:absolute;inset:0;background:radial-gradient(800px circle at 85% 20%,var(--accent-soft),transparent 60%);pointer-events:none}
.mono{
  position:absolute;inset-inline-end:18px;bottom:-45px;
  font:800 clamp(140px,24vw,250px)/1 "Fraunces",Georgia,serif;letter-spacing:-.08em;
  background:linear-gradient(180deg,var(--accent) 0%,transparent 90%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:.09;
  direction:ltr;user-select:none;pointer-events:none;
}
.hero .in{position:relative;max-width:650px;z-index:1}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;
  margin-bottom:16px;border:1px solid rgba(99,102,241,.2);
}
.hero-badge svg{width:15px;height:15px}
h1{
  margin:0 0 14px;font-size:clamp(30px,5vw,48px);line-height:1.2;font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--ink) 30%,var(--accent) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero p{margin:0;color:var(--muted);font-size:16px;max-width:56ch;line-height:1.75}
.hero-meta{margin-top:22px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.name-pill{
  display:inline-flex;align-items:center;gap:10px;padding:7px 15px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13.5px;
  color:var(--ink-secondary);box-shadow:var(--shadow-sm);
}
.name-pill svg{width:16px;height:16px;color:var(--accent)}

.hero-visual{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.orb-container{position:relative;width:148px;height:148px;display:grid;place-items:center}
.orb-ring{position:absolute;inset:0;border-radius:32px;border:1.5px dashed var(--line-strong);animation:spinSlow 28s linear infinite}
.orb-ring-2{position:absolute;inset:14px;border-radius:26px;border:1px solid var(--accent-soft);transform:rotate(45deg);animation:spinSlow 20s linear infinite reverse}
.orb-core{
  width:88px;height:88px;border-radius:24px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#fff;
  box-shadow:0 18px 36px -8px var(--accent-glow),inset 0 2px 4px rgba(255,255,255,.4);
  animation:floatCore 5s ease-in-out infinite;
}
.orb-core svg{width:42px;height:42px}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes floatCore{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-7px) rotate(4deg)}}

/* Toolbar */
.tools{margin:8px 0 28px}
.tools-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.search-wrap{position:relative;flex:1 1 300px;max-width:460px;display:flex;align-items:center}
.search-ico{position:absolute;inset-inline-start:15px;width:18px;height:18px;color:var(--muted);pointer-events:none;transition:color .2s}
.search{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;
  padding:11px 42px;font-size:14px;color:var(--ink);box-shadow:var(--shadow-sm);transition:all .25s ease;
}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow-sm)}
.search:focus~.search-ico{color:var(--accent)}
.kbd-hint{
  position:absolute;inset-inline-end:12px;padding:2px 7px;font-size:11px;font-family:monospace;
  color:var(--muted);background:var(--surface-subtle);border:1px solid var(--line);border-radius:6px;
  pointer-events:none;transition:opacity .2s;
}
.clear-btn{
  position:absolute;inset-inline-end:10px;width:24px;height:24px;border-radius:50%;border:none;
  background:var(--surface-subtle);color:var(--muted);display:none;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:all .2s;
}
.clear-btn:hover{background:var(--accent-soft);color:var(--accent)}
.clear-btn svg{width:14px;height:14px}

.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats .cat-btn{
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:var(--surface);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;
  color:var(--muted);box-shadow:var(--shadow-sm);transition:all .25s var(--ease-spring);
}
.cats .cat-btn svg{width:15px;height:15px;opacity:.75;transition:transform .25s var(--ease-spring)}
.cats .cat-btn:hover{border-color:var(--accent);color:var(--ink);transform:translateY(-2px)}
.cats .cat-btn:hover svg{transform:scale(1.15);opacity:1}
.cats .cat-btn[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  border-color:transparent;box-shadow:0 8px 20px -6px var(--accent-glow);
}
.cats .cat-btn[aria-pressed="true"] svg{opacity:1}
.cat-count{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--surface-subtle);color:var(--muted);font-weight:700}
.cats .cat-btn[aria-pressed="true"] .cat-count{background:rgba(255,255,255,.22);color:#fff}

/* Cards Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;padding-bottom:72px}
.card{
  --h:230;--card-accent:hsl(var(--h) 78% 56%);--card-soft:hsl(var(--h) 85% 94%);--card-border:hsl(var(--h) 60% 85%);
  position:relative;display:flex;flex-direction:column;gap:16px;background:var(--surface);
  border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow-md);
  overflow:hidden;transition:transform .35s var(--ease-spring),border-color .35s ease,box-shadow .35s ease;
  animation:cardEnter .55s var(--ease-spring) backwards;
}
html[data-theme="dark"] .card{
  --card-accent:hsl(var(--h) 82% 68%);--card-soft:hsla(var(--h),70%,60%,.14);--card-border:hsla(var(--h),70%,65%,.32);
  backdrop-filter:blur(16px);
}
@keyframes cardEnter{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s ease;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),hsla(var(--h),85%,62%,.13),transparent 60%);
}
.card::after{
  content:"";position:absolute;top:0;inset-inline:0;height:4px;opacity:.85;
  background:linear-gradient(90deg,hsl(var(--h) 80% 58%),hsl(calc(var(--h) + 35) 80% 62%));
}
.card:hover{transform:translateY(-6px);border-color:var(--card-border);box-shadow:var(--shadow-lg)}
.card:hover::before{opacity:1}

.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;z-index:1}
.ico-wrap{
  display:grid;place-items:center;width:54px;height:54px;border-radius:16px;
  background:var(--card-soft);color:var(--card-accent);border:1px solid var(--card-border);
  box-shadow:0 8px 20px -6px hsla(var(--h),80%,50%,.25);transition:transform .35s var(--ease-spring);
}
.card:hover .ico-wrap{transform:scale(1.08) rotate(-4deg)}
.ico-wrap svg{width:26px;height:26px}
.ico-emoji{font-size:25px;line-height:1}

.badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cat-tag{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-subtle);color:var(--muted);border:1px solid var(--line)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 11px;border-radius:999px;background:var(--success-bg);color:var(--success);font-weight:700}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.dev{background:var(--warn-bg);color:var(--warn)}

.card-body{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;gap:8px}
.card h2{margin:0;font-size:19px;font-weight:800;line-height:1.35;color:var(--ink);transition:color .2s}
.card:hover h2{color:var(--card-accent)}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.7;flex:1}

.card-foot{position:relative;z-index:1;padding-top:12px;border-top:1px solid var(--line);display:flex}
.go{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:13px;padding:11px 16px;background:var(--card-soft);color:var(--card-accent);
  border:1px solid transparent;font-weight:700;font-size:13.5px;transition:all .25s var(--ease-spring);
}
.go svg{width:17px;height:17px;transition:transform .25s var(--ease-spring)}
html[dir="rtl"] .go svg.arrow-ico{transform:scaleX(-1)}
.card:hover .go:not([aria-disabled="true"]){background:var(--card-accent);color:#fff;box-shadow:0 8px 20px -6px hsla(var(--h),80%,50%,.5)}
html[dir="rtl"] .card:hover .go:not([aria-disabled="true"]) svg.arrow-ico{transform:scaleX(-1) translateX(4px)}
html[dir="ltr"] .card:hover .go:not([aria-disabled="true"]) svg.arrow-ico{transform:translateX(4px)}
.go[aria-disabled="true"]{background:var(--surface-subtle);color:var(--muted);border:1px dashed var(--line-strong);cursor:not-allowed}

/* Empty State */
.empty{
  grid-column:1/-1;text-align:center;padding:64px 24px;border:1.5px dashed var(--line-strong);
  border-radius:var(--radius-xl);background:var(--surface);color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:12px;animation:cardEnter .4s var(--ease-spring);
}
.empty-ico{width:60px;height:60px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:4px}
.empty-ico svg{width:30px;height:30px}
.empty h3{margin:0;color:var(--ink);font-size:17px}
.empty p{margin:0;font-size:14px}

/* Floating Toast */
.toast{
  position:fixed;bottom:26px;inset-inline-end:26px;z-index:100;display:flex;align-items:center;gap:10px;
  padding:13px 18px;border-radius:14px;background:var(--surface);color:var(--ink);border:1px solid var(--warn);
  box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:600;
  transform:translateY(140%);opacity:0;pointer-events:none;transition:transform .35s var(--ease-spring),opacity .35s ease;
}
.toast.show{transform:translateY(0);opacity:1}
.toast svg{width:20px;height:20px;color:var(--warn);flex-shrink:0}

/* Footer */
footer{margin-top:auto;border-top:1px solid var(--line);background:var(--bg-elevated);backdrop-filter:blur(12px);padding:26px 0;color:var(--muted);font-size:13.5px}
footer .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.gh-link{
  display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-secondary);font-weight:600;transition:all .2s ease;
}
.gh-link:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.gh-link svg{width:17px;height:17px}

@media(max-width:768px){
  .hero-card{padding:32px 24px;flex-direction:column;align-items:flex-start}
  .hero-visual{display:none}
  .search-wrap{max-width:100%}
}
@media(max-width:560px){
  .who small,.chip.count{display:none}
  .bar{height:64px}
  .hero{padding:28px 0 20px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<div class="ambient" aria-hidden="true">
  <div class="ambient-grid"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<header>
  <div class="wrap bar">
    <div class="brand">
      <div class="logo" aria-hidden="true">MM</div>
      <div class="who">Mostafa Modaberi<small data-t="subtitle"></small></div>
    </div>
    <div class="sp"></div>
    <div class="nav-actions">
      <span class="chip count">
        <span class="dot" aria-hidden="true"></span>
        <span data-t="total"></span>
        <b id="total">0</b>
      </span>
      <button class="icon-btn" id="lang" type="button" aria-label="Switch Language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="lang-txt"></span>
      </button>
      <button class="icon-btn" id="theme" type="button" aria-label="Toggle color theme">
        <span id="theme-ico"></span>
        <span id="theme-txt"></span>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="hero-card">
      <div class="mono" aria-hidden="true">MM</div>
      <div class="in">
        <div class="hero-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span data-t="badge"></span>
        </div>
        <h1 data-t="title"></h1>
        <p data-t="intro"></p>
        <div class="hero-meta">
          <div class="name-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Mostafa Modaberi · مصطفی مدبری</span>
          </div>
        </div>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <div class="orb-container">
          <div class="orb-ring"></div>
          <div class="orb-ring-2"></div>
          <div class="orb-core">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="14" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section aria-label="apps">
    <div class="tools">
      <div class="tools-row">
        <div class="search-wrap">
          <input class="search" id="q" type="search" autocomplete="off">
          <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span class="kbd-hint" id="kbd">/</span>
          <button class="clear-btn" id="clear-q" type="button" aria-label="Clear search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="cats" id="cats" role="group"></div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<div class="toast" id="msg" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <span id="msg-txt"></span>
</div>

<footer>
  <div class="wrap">
    <span>Designed &amp; Developed by <strong>Mostafa Modaberi</strong> · <span id="year"></span></span>
    <a class="gh-link" id="gh" href="#" target="_blank" rel="noopener" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
      <span>GitHub</span>
    </a>
  </div>
</footer>

<script>
// Central config: add a new app by appending one object below.
// hue (0-360) is optional: each app gets its own color automatically, set hue to override.
// svg (optional): custom inline SVG string; otherwise uses built-in SVG by id or falls back to icon emoji.
// path is relative to the dashboard root and must match apps/APP-NAME/
window.SITE = {
  github: "https://github.com/Mostafa-Modaberi", // e.g. "https://github.com/USERNAME" — footer link stays hidden while empty
  apps: [
    {
      id: "invoice-maker",
      path: "apps/invoice-maker/",
      category: "utility",
      status: "active",
      icon: "🧾",
      name: { fa: "فاکتورساز و مدیریت مالی", en: "Invoice Maker & Finance" },
      desc: {
        fa: "صدور و چاپ فاکتور، مدیریت کالا و انبار، تاریخچه و گزارش‌های مالی.",
        en: "Create and print invoices, manage products and inventory, and review financial reports."
      }
    },
    {
      id: "class-roster",
      path: "apps/class-roster/",
      category: "education",
      status: "active", // "active" | "dev"
      icon: "▦",
      name: { fa: "چاپ لیست کلاسی", en: "Class Roster Print" },
      desc: {
        fa: "ابزاری برای مدیریت، تنظیم و چاپ لیست کلاسی با قالب مناسب چاپ A4.",
        en: "Manage, arrange and print class lists in an A4 print-ready layout."
      }
    }
  ]
};
</script>

<script>
(function(){
  var SVGS = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
    arrow: '<svg class="arrow-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
    empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>',
    cats: {
      all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>',
      education: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>',
      utility: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
      design: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>',
      code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
      other: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>'
    },
    apps: {
      "invoice-maker": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M14 8H8"/><path d="M16 12H8"/><path d="M13 16H8"/></svg>',
      "class-roster": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>'
    }
  };

  var T = {
    fa: {
      badge: "فضای کاری دیجیتال",
      subtitle: "داشبورد وب‌اپلیکیشن‌های شخصی",
      total: "تعداد برنامه‌ها:",
      title: "برنامه‌های کاربردی",
      intro: "مجموعه‌ای از ابزارها و وب‌اپلیکیشن‌های اختصاصی ساخته شده توسط مصطفی مدبری برای مدیریت سریع‌تر و هوشمندتر کارها.",
      search: "جست‌وجوی برنامه‌ها (نام یا توضیحات)…",
      all: "همه",
      open: "ورود به برنامه",
      soon: "به‌زودی",
      active: "فعال",
      dev: "در حال توسعه",
      emptyTitle: "نتیجه‌ای پیدا نشد",
      empty: "برنامه‌ای در این دسته یا با این عبارت جست‌وجو پیدا نشد.",
      devmsg: "این برنامه در حال توسعه است و هنوز باز نمی‌شود.",
      lang: "English",
      dark: "تم تاریک",
      light: "تم روشن",
      cat: {
        education: "آموزشی",
        utility: "ابزارهای کاربردی",
        design: "طراحی و گرافیک",
        code: "برنامه‌نویسی",
        other: "سایر"
      }
    },
    en: {
      badge: "Digital Workspace",
      subtitle: "Personal Web Apps Dashboard",
      total: "Total apps:",
      title: "Useful Web Apps",
      intro: "A curated suite of custom web applications and utilities built by Mostafa Modaberi for faster, smarter workflows.",
      search: "Search apps by name or description…",
      all: "All",
      open: "Open App",
      soon: "Coming Soon",
      active: "Active",
      dev: "In Development",
      emptyTitle: "No Matching Apps",
      empty: "No apps match this category or search query.",
      devmsg: "This app is still in development and cannot be opened yet.",
      lang: "فارسی",
      dark: "Dark",
      light: "Light",
      cat: {
        education: "Education",
        utility: "Utilities",
        design: "Design & Graphics",
        code: "Programming",
        other: "Other"
      }
    }
  };

  var cfg = window.SITE || { apps: [] }, apps = cfg.apps, root = document.documentElement;
  var s = { lang: "fa", cat: "all", q: "" }, toastTimer = null;

  try {
    var st = localStorage.getItem("mm-theme");
    if (st === "dark") {
      root.dataset.theme = "dark";
    } else if (!st && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      root.dataset.theme = "dark";
    }
  } catch (e) {}

  try {
    var sl = localStorage.getItem("mm-lang");
    if (sl === "fa" || sl === "en") s.lang = sl;
  } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function showToast(text) {
    var toast = $("msg");
    $("msg-txt").textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 3400);
  }

  function getAppIconHTML(a) {
    if (a.svg) return a.svg;
    if (SVGS.apps[a.id]) return SVGS.apps[a.id];
    if (a.icon && a.icon.trim().indexOf("<svg") === 0) return a.icon;
    return '<span class="ico-emoji">' + (a.icon || "◆") + '</span>';
  }

  function updateSearchControls() {
    var hasQ = s.q.length > 0;
    $("clear-q").style.display = hasQ ? "flex" : "none";
    $("kbd").style.opacity = hasQ ? "0" : "1";
  }

  function attachSpotlight(card) {
    card.addEventListener("mousemove", function (e) {
      var rect = card.getBoundingClientRect();
      card.style.setProperty("--mx", (e.clientX - rect.left) + "px");
      card.style.setProperty("--my", (e.clientY - rect.top) + "px");
    });
  }

  function render() {
    var t = T[s.lang];
    var isDark = root.dataset.theme === "dark";

    root.lang = s.lang;
    root.dir = s.lang === "fa" ? "rtl" : "ltr";

    document.querySelectorAll("[data-t]").forEach(function (n) {
      if (t[n.dataset.t] != null) n.textContent = t[n.dataset.t];
    });

    $("q").placeholder = t.search;
    $("q").setAttribute("aria-label", t.search);
    $("lang-txt").textContent = t.lang;
    $("theme-txt").textContent = isDark ? t.light : t.dark;
    $("theme-ico").innerHTML = isDark ? SVGS.sun : SVGS.moon;
    $("total").textContent = apps.length;

    updateSearchControls();

    var cats = $("cats");
    cats.textContent = "";
    ["all", "education", "utility", "design", "code", "other"].forEach(function (c) {
      var count = c === "all"
        ? apps.length
        : apps.filter(function (a) { return a.category === c; }).length;
      if (c !== "all" && count === 0 && s.cat !== c) return;

      var b = el("button", "cat-btn");
      b.type = "button";
      b.setAttribute("aria-pressed", String(s.cat === c));
      b.innerHTML =
        (SVGS.cats[c] || SVGS.cats.other) +
        "<span>" + (c === "all" ? t.all : t.cat[c]) + "</span>" +
        '<span class="cat-count">' + count + "</span>";
      b.onclick = function () { s.cat = c; render(); };
      cats.appendChild(b);
    });

    var q = s.q.trim().toLowerCase();
    var list = apps.filter(function (a) {
      if (s.cat !== "all" && a.category !== s.cat) return false;
      if (!q) return true;
      var hay = (
        (a.name.fa || "") + " " +
        (a.name.en || "") + " " +
        (a.desc.fa || "") + " " +
        (a.desc.en || "") + " " +
        (t.cat[a.category] || "")
      ).toLowerCase();
      return hay.indexOf(q) > -1;
    });

    var g = $("grid");
    g.textContent = "";

    if (!list.length) {
      var emp = el("div", "empty");
      emp.innerHTML =
        '<div class="empty-ico" aria-hidden="true">' + SVGS.empty + "</div>" +
        "<h3>" + t.emptyTitle + "</h3>" +
        "<p>" + t.empty + "</p>";
      g.appendChild(emp);
      return;
    }

    list.forEach(function (a, idx) {
      var isDev = a.status === "dev";
      var card = el("article", "card");
      var hue = a.hue != null ? a.hue : (apps.indexOf(a) * 67 + 228) % 360;
      card.style.setProperty("--h", hue);
      card.style.animationDelay = (idx * 65) + "ms";

      var head = el("div", "card-head");
      var icoWrap = el("div", "ico-wrap");
      icoWrap.setAttribute("aria-hidden", "true");
      icoWrap.innerHTML = getAppIconHTML(a);
      head.appendChild(icoWrap);

      var badges = el("div", "badges");
      badges.appendChild(el("span", "cat-tag", t.cat[a.category] || t.cat.other));
      badges.appendChild(el("span", "st" + (isDev ? " dev" : ""), isDev ? t.dev : t.active));
      head.appendChild(badges);
      card.appendChild(head);

      var body = el("div", "card-body");
      body.appendChild(el("h2", null, a.name[s.lang] || a.name.en || a.name.fa));
      body.appendChild(el("p", null, a.desc[s.lang] || a.desc.en || a.desc.fa));
      card.appendChild(body);

      var foot = el("div", "card-foot");
      var go = el("a", "go");
      if (isDev) {
        go.href = "#";
        go.setAttribute("aria-disabled", "true");
        go.innerHTML = SVGS.lock + "<span>" + t.soon + "</span>";
        go.onclick = function (e) { e.preventDefault(); showToast(t.devmsg); };
      } else {
        go.href = a.path;
        go.innerHTML = "<span>" + t.open + "</span>" + SVGS.arrow;
      }
      foot.appendChild(go);
      card.appendChild(foot);

      attachSpotlight(card);
      g.appendChild(card);
    });
  }

  $("lang").onclick = function () {
    s.lang = s.lang === "fa" ? "en" : "fa";
    save("mm-lang", s.lang);
    render();
  };

  $("theme").onclick = function () {
    var dark = root.dataset.theme !== "dark";
    if (dark) root.dataset.theme = "dark";
    else delete root.dataset.theme;
    save("mm-theme", dark ? "dark" : "light");
    render();
  };

  $("q").oninput = function (e) {
    s.q = e.target.value;
    render();
  };

  $("clear-q").onclick = function () {
    s.q = "";
    $("q").value = "";
    render();
    $("q").focus();
  };

  document.addEventListener("keydown", function (e) {
    var tag = document.activeElement ? document.activeElement.tagName : "";
    if ((e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA") || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")) {
      e.preventDefault();
      $("q").focus();
    } else if (e.key === "Escape" && document.activeElement === $("q")) {
      if (s.q) {
        s.q = "";
        $("q").value = "";
        render();
      } else {
        $("q").blur();
      }
    }
  });

  $("year").textContent = new Date().getFullYear();

  if (cfg.github) {
    var gh = $("gh");
    gh.href = cfg.github;
    gh.hidden = false;
  }

  render();
})();
</script>
</body>
